apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentic-graphrag-api-hpa
  namespace: agentic-graphrag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentic-graphrag-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
