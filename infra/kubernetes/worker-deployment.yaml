apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-graphrag-worker
  namespace: agentic-graphrag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-graphrag-worker
  template:
    metadata:
      labels:
        app: agentic-graphrag-worker
    spec:
      containers:
        - name: worker
          image: agentic-graphrag-api:latest
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args:
            - "-A"
            - "apps.worker.celery_app"
            - "worker"
            - "--loglevel=INFO"
          envFrom:
            - configMapRef:
                name: agentic-graphrag-config
            - secretRef:
                name: agentic-graphrag-secrets
