[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-graphrag"
version = "0.1.0"
description = "Production-style Agentic GraphRAG platform with graph, vector, agents, evaluation and UI."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",
  "neo4j>=5.23.0",
  "qdrant-client>=1.10.0",
  "minio>=7.2.0",
  "sentence-transformers>=3.0.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "networkx>=3.3",
  "rapidfuzz>=3.9.0",
  "beautifulsoup4>=4.12.0",
  "python-dotenv>=1.0.0",
  "openai>=1.40.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]
docs = [
  "jupyter>=1.0.0",
  "notebook>=7.0.0"
]
ingestion = [
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  "pillow>=10.0.0",
  "pytesseract>=0.3.10"
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["graphrag_system*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
