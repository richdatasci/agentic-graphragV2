services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-graphrag-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis
      - neo4j
      - qdrant
      - minio
      - ollama
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-graphrag-worker
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - redis
      - postgres
      - neo4j
      - qdrant
      - minio
    command: celery -A apps.worker.celery_app worker --loglevel=INFO

  frontend:
    image: node:20-alpine
    container_name: agentic-graphrag-frontend
    working_dir: /app/apps/frontend
    volumes:
      - ./:/app
      - frontend_node_modules:/app/apps/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  postgres:
    image: postgres:16-alpine
    container_name: agentic-graphrag-postgres
    environment:
      POSTGRES_DB: agentic_graphrag
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: graphrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agentic-graphrag-redis
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5-community
    container_name: agentic-graphrag-neo4j
    environment:
      NEO4J_AUTH: neo4j/agentic-graphrag-password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentic-graphrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: agentic-graphrag-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  ollama:
    image: ollama/ollama:latest
    container_name: agentic-graphrag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  minio_data:
  ollama_data:
  frontend_node_modules:
